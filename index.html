<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Piece - Exam</title>

    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h2 class="title">One Piece - Exam</h2>
        <form class="search-form">
          <input type="text" class="search-input" placeholder="name" />
          <button type="submit" class="search-btn">Search</button>
        </form>
      </header>
      <section class="ceaputred-container">
        <h2 class="rewards-title">
          Rewards: <span class="rewards-qty">0</span>
        </h2>
      </section>
      <section class="pages-container">
        <h2 class="pages-title">Characters:</h2>
        <ul class="page"></ul>
        <button type="button">Prev</button><button type="button">Next</button>
      </section>
    </div>
  </body>
</html>

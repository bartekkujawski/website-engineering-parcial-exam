<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Piece - Exam</title>

    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h2 class="title">One Piece - Exam</h2>
        <form class="search-form">
          <input
            name="search-input"
            id="search-input"
            type="text"
            class="search-input"
            placeholder="name"
          />
          <button type="submit" class="search-btn">Search</button>
        </form>
      </header>
      <sedtion class="fruit-effect">
        <select class="fruit">
          <option value="">-- Choose a Devil Fruit --</option>
          <option value="gomu">Gomu Gomu no Mi (Rubber)</option>
          <option value="mera">Mera Mera no Mi (Flame)</option>
          <option value="hie">Hie Hie no Mi (Ice)</option>
          <option value="goro">Goro Goro no Mi (Lightning)</option>
          <option value="yami">Yami Yami no Mi (Darkness)</option>
        </select>
      </sedtion>
      <section class="ceaputred-container">
        <h2 class="bounty-title">
          Bounty: <span class="bounty-number">0</span>
        </h2>
      </section>
      <section class="pages-container">
        <h2 class="pages-title">Characters:</h2>
        <ul class="page"></ul>
        <div class="btn-container">
          <span class="clear-container"></span>
          <div class="pages-btns">
            <button type="button" class="prev-btn">Prev</button
            ><button type="button" class="next-btn">Next</button>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
